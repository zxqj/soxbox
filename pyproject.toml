[project]
name = "soxbox"
version = "0.1.0"
description = "Launch an EC2 instance, tunnel a SOCKS proxy through it, and browse via Firefox."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.34",
    "botocore[crt]>=1.34",
    "pyyaml>=6.0",
]

[project.scripts]
soxbox = "soxbox:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["soxbox.py"]

[tool.hatch.build.targets.sdist]
only-include = ["soxbox.py", "config.example.yaml", "README.md"]
